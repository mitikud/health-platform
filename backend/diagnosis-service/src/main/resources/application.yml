server:
  port: 8083

spring:
  application:
    name: diagnosis-service
  profiles:
    group:
      offline: offline
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/clinical}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topics:
    diagnosisSuggested: diagnosis.suggested


minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:uploads}

# (Optional) Kafka placeholders
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

#ai:
#  openai:
#    apiKey: ${OPENAI_API_KEY:}
#    whisper:
#      model: gpt-4o-mini-transcribe

ai:
  vosk:
    modelPath: ${VOSK_MODEL_PATH:/models/en}    # change per language
    sampleRate: 16000


