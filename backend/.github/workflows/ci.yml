name: CI

on:
  push:
    branches: [ "**" ]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven - Build & Test
        run: mvn -q -B clean verify

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [
          "api-gateway","auth-service","user-service","diagnosis-service",
          "medication-service","translation-service","notification-service",
          "report-service","discovery-server","config-server"
        ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.svc }}
          push: false
          tags: test/${{ matrix.svc }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint umbrella chart
        run: |
          cd backend/helm
          helm dependency update
          helm lint .
