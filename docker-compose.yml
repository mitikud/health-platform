#version: "3.9"

name: health-platform

services:
  # ---- Infra -----------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]
    networks: [backend]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [backend]

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healthdb}
      MYSQL_ROOT_HOST: "%"   # allow root from other containers/host
    ports:
      - "${MYSQL_PORT:-3306}:3306"  # if 3306 busy, use 3307:3306 and connect to 127.0.0.1:3307
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [ backend ]   # ← add this





  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
    networks: [backend]

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-02-07T02-24-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    networks: [backend]

  # ---- App Layer --------------------------------------------------------------
  discovery-server:
    build: ./backend/discovery-server
    image: health/discovery-server:local
    ports: [ "8761:8761" ]
    networks: [ backend ]

  api-gateway:
    build: ./backend/api-gateway
    image: health/api-gateway:local
    depends_on:
      - auth-service
      - user-service
      - diagnosis-service
      - medication-service
      - translation-service
      - notification-service
      - report-service
      - discovery-server
    environment:
      SERVER_PORT: 8080
      # If you're using service hostnames directly (no Eureka):
      ROUTE_AUTH_URI: http://auth-service:8081
      ROUTE_USER_URI: http://user-service:8082
      ROUTE_DIAGNOSIS_URI: http://diagnosis-service:8083
      ROUTE_MEDICATION_URI: http://medication-service:8084
      ROUTE_TRANSLATION_URI: http://translation-service:8085
      ROUTE_NOTIFICATION_URI: http://notification-service:8086
      ROUTE_REPORT_URI: http://report-service:8087
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["8080:8080"]
    networks: [backend]

  auth-service:
    build: ./backend/auth-service
    image: health/auth-service:local
    depends_on: [ mysql, redis, discovery-server ]   # ← replace postgres with mysql
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-healthdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: [ "8081:8081" ]
    networks: [ backend ]

  user-service:
    build: ./backend/user-service
    image: health/user-service:local
    depends_on: [ mysql, discovery-server ]   # ← replace postgres
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-healthdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: [ "8082:8082" ]
    networks: [ backend ]

  diagnosis-service:
    build: ./backend/diagnosis-service
    image: health/diagnosis-service:local
    depends_on: [kafka, mongo, minio, discovery-server]
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/clinical
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: uploads
      TRANSLATION_BASE_URL: http://translation-service:8085
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["8083:8083"]
    networks: [backend]

  medication-service:
    build: ./backend/medication-service
    image: health/medication-service:local
    depends_on: [kafka, mongo, redis, discovery-server]
    environment:
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/clinical
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DRUG_KNOWLEDGE_CACHE_HOST: redis
      DRUG_KNOWLEDGE_CACHE_PORT: 6379
      TRANSLATION_BASE_URL: http://translation-service:8085
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["8084:8084"]
    networks: [backend]

  translation-service:
    build: ./backend/translation-service
    image: health/translation-service:local
    depends_on: [discovery-server]
    environment:
      SERVER_PORT: 8085
      # If you proxy to external providers (optional placeholders):
      PROVIDER: local
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
    ports: ["8085:8085"]
    networks: [backend]

  notification-service:
    build: ./backend/notification-service
    image: health/notification-service:local
    depends_on: [kafka, discovery-server]
    environment:
      SERVER_PORT: 8086
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TWILIO_SID: ${TWILIO_SID}
      TWILIO_TOKEN: ${TWILIO_TOKEN}
      TWILIO_FROM: ${TWILIO_FROM}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["8086:8086"]
    networks: [backend]

  report-service:
    build: ./backend/report-service
    image: health/report-service:local
    depends_on: [mongo, discovery-server]
    environment:
      SERVER_PORT: 8087
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/clinical
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports: ["8087:8087"]
    networks: [backend]

  # ---- Frontend ---------------------------------------------------------------
  react-app:
    build: ./frontend/react-app
    image: health/react-app:local
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports: ["5173:5173"]   # Vite dev default
    depends_on: [api-gateway]
    networks: [backend]

  frontend:
    image: health/frontend:local
    build:
      context: ../frontend/react-app
    depends_on: [ api-gateway ]
    ports: [ "8088:80" ]  # open http://localhost:8088
    networks: [ backend ]


networks:
  backend:

volumes:
  mongodata:
  redisdata:
  miniodata:
  mysql_data:
